name: Android CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "develop", "feat/*", "feat/Sergio" ]
  pull_request:
    branches: [ "main", "master", "develop", "feat/*", "feat/Sergio" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Ensure secrets.properties exists
        run: |
          if [ ! -f secrets.properties ]; then
            echo "SUPABASE_URL=https://wlsklpqyrxricwktpcle.supabase.co" > secrets.properties
            echo "SUPABASE_ANON_KEY=sb_publishable_XVdpV1KZtu80FBJtCk2m6w__IlhPKKH" >> secrets.properties
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug
