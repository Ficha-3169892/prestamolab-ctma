name: Android CI

# Quality gates en cada push y pull request: pruebas unitarias, compilación y lint.
# Las pruebas instrumentadas (Room, WorkManager, UI con Compose) necesitan un dispositivo:
# se ejecutan en el teléfono de pruebas (ver docs/PLAN_PRUEBAS.md); aquí solo se compilan.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      # Sin local.properties la app compila con SUPABASE_URL vacía: las pruebas unitarias
      # usan dobles y MockWebServer, nunca el Supabase real ni sus credenciales.
      - name: Pruebas unitarias
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Compilar la app y las pruebas instrumentadas
        run: ./gradlew assembleDebug assembleDebugAndroidTest --console=plain

      # Quality gate: la compilación falla si lint encuentra errores (las advertencias quedan en el reporte)
      - name: Lint
        run: ./gradlew lintDebug --console=plain

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas-unitarias
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Publicar APK de depuración
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
